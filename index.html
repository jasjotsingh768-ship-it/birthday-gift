<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 600px;
      padding: 35px 20px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: appear 1.5s ease;
    }

    .cake {
      font-size: 80px;
      animation: bounce 1.5s infinite;
    }

    h1 {
      margin-top: 10px;
      font-size: clamp(2.3rem, 10vw, 5rem);
      text-shadow: 0 0 15px #fff, 0 0 30px #ffeb3b;
      animation: glow 2s infinite alternate;
    }

    h2 {
      margin: 10px 0;
      font-size: clamp(1.3rem, 5vw, 2rem);
    }

    p {
      margin: 20px auto;
      max-width: 500px;
      font-size: clamp(1rem, 4vw, 1.25rem);
      line-height: 1.6;
    }

    button {
      border: none;
      outline: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff4f81;
      background: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #fff0f5;
    }

    /* Balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 60px;
      height: 75px;
      border-radius: 50%;
      opacity: 0.85;
      animation: float 8s linear infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 100px;
      background: white;
      top: 70px;
      left: 50%;
    }

    .b1 {
      left: 5%;
      background: #ff4757;
      animation-delay: 0s;
    }

    .b2 {
      left: 20%;
      background: #2ed573;
      animation-delay: 2s;
    }

    .b3 {
      right: 20%;
      background: #1e90ff;
      animation-delay: 4s;
    }

    .b4 {
      right: 5%;
      background: #ffa502;
      animation-delay: 1s;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      opacity: 0.9;
      z-index: 20;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-50vh) rotate(5deg);
      }

      100% {
        transform: translateY(-110vh) rotate(-5deg);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px white,
          0 0 20px #ffeb3b;
      }

      to {
        text-shadow:
          0 0 20px white,
          0 0 40px #ffeb3b,
          0 0 60px #ff4081;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 15px;
      }

      .cake {
        font-size: 65px;
      }

      button {
        width: 80%;
      }

      .balloon {
        width: 45px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <!-- Main Birthday Card -->
  <div class="container">
    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <h2>🎉 Wishing You an Amazing Day! 🎉</h2>

    <p>
      May your birthday be filled with happiness, laughter,
      love, beautiful memories, and lots of cake! 💖
    </p>

    <button onclick="celebrate()">
      🎊 Celebrate 🎊
    </button>
  </div>

  <script>
    const colors = [
      "#ff4757",
      "#ffa502",
      "#2ed573",
      "#1e90ff",
      "#ff6bcb",
      "#ffffff",
      "#ffe66d"
    ];

    function createConfetti() {
      const confetti = document.createElement("div");

      confetti.classList.add("confetti");

      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      confetti.style.width =
        Math.random() * 8 + 6 + "px";

      confetti.style.height =
        Math.random() * 12 + 8 + "px";

      confetti.style.animationDuration =
        Math.random() * 3 + 3 + "s";

      confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 7000);
    }

    // Continuous confetti
    setInterval(createConfetti, 120);

    // Big celebration when button is clicked
    function celebrate() {
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          createConfetti();
        }, i * 15);
      }

      alert("🎉 Happy Birthday! 🎂🥳");
    }
  </script>

</body>
</html>
